# Server dei viaggi condivisi in diretta: vedi worker.js.
# Pubblicazione (da questa cartella): npx wrangler deploy
name = "mytrip-sync"
main = "worker.js"
compatibility_date = "2026-10-01"

# L'id dello spazio KV lo crea `npx wrangler kv namespace create mytrip-sync`.
[[kv_namespaces]]
binding = "KV"
id = "5de50cb092264124a1fbc06864d9ab74"

# Contatore delle app in uso e date delle condivisioni (worker.js, `Contatore`):
# un Durable Object con archivio SQLite, compreso nel piano gratuito.
[[durable_objects.bindings]]
name = "CONTA"
class_name = "Contatore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Contatore"]

# Ogni 15 minuti: riepiloghi giornalieri delle notifiche e novità in attesa (worker.js, `scheduled`).
[triggers]
crons = ["*/15 * * * *"]

# Limite di richieste per indirizzo IP (worker.js, `tooMany`): filtro largo contro
# chi riempie KV con scritture inventate. Contatori per sede di Cloudflare.
[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 600, period = 60 }
